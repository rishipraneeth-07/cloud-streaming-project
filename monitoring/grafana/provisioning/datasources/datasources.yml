apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://project-prometheus:9090
    isDefault: true

  - name: Project PostgreSQL
    uid: project-postgres
    type: postgres
    access: proxy
    url: project-postgres:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 170000
